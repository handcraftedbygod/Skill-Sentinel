[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltrace"
version = "0.1.0"
description = "A behavioral scanner for agent skills (Claude, Cursor, Codex): sandboxes and traces what a skill actually does instead of trusting its description."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
    "rich-argparse>=1.5",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/handcraftedbygod/SkillTrace"
Repository = "https://github.com/handcraftedbygod/SkillTrace"
Issues = "https://github.com/handcraftedbygod/SkillTrace/issues"

[project.scripts]
skilltrace = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
