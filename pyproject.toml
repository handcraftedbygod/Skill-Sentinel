[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-sentinel"
version = "0.1.0"
description = "A behavioral scanner for Claude Skills: sandboxes and traces what a skill actually does instead of trusting its description."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skill-sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
