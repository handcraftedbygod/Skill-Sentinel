# DNS sinkhole: every name the traced skill looks up resolves to the loopback
# address where mitmproxy is listening, so HTTP(S) connections land on the
# interception proxy instead of the real internet.
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
address=/#/127.0.0.1
log-queries
log-facility=/scratch/dnsmasq.log
